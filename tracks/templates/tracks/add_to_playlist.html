{% extends "base.html" %}
{% block content %}
<style>
.add-track-container {
    max-width: 600px;
    margin: 50px auto;
    background-color: #1e1e1e;
    color: #f1f1f1;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
    text-align: center;
}

.add-track-container h2 {
    font-size: 24px;
    margin-bottom: 25px;
    color: #ffffff;
}

.add-track-container form {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.add-track-container label {
    font-size: 16px;
    margin-bottom: 10px;
}

.add-track-container select {
    width: 80%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background-color: #333;
    color: #f1f1f1;
    font-size: 15px;
    margin-bottom: 20px;
    cursor: pointer;
}

.add-track-container select:focus {
    outline: 2px solid #4CAF50;
}

.add-track-container button {
    background-color: #4CAF50;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.add-track-container button:hover {
    background-color: #45a049;
    transform: scale(1.05);
}

.add-track-container a {
    display: inline-block;
    margin-top: 20px;
    color: #66b2ff;
    text-decoration: none;
    font-size: 16px;
    transition: 0.3s;
}

.add-track-container a:hover {
    color: #99d1ff;
    text-decoration: underline;
}
</style>

<div class="add-track-container">
    <h2>Добавить <span style="color:#4CAF50;">"{{ track.title }}"</span> в плейлист</h2>

    <form method="post">
        {% csrf_token %}
        <label for="playlist_id">Выберите плейлист:</label>
        <select name="playlist_id" id="playlist_id" required>
            {% for playlist in playlists %}
                <option value="{{ playlist.id }}">{{ playlist.name }}</option>
            {% empty %}
                <option disabled>У вас нет плейлистов</option>
            {% endfor %}
        </select>

        <button type="submit">✅ Добавить</button>
    </form>

    <a href="{% url 'create_playlist' %}">➕ Создать новый плейлист</a>
</div>
{% endblock %}
