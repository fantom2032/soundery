<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Soundery — Music Platform</title>
</head>
<body>

    <nav>
        <div class="left">
            <a href="{% url 'track_list' %}">Главная</a>
            {% if user.is_authenticated %}
                <a href="{% url 'album_list' %}">Альбомы</a>
                <a href="{% url 'upload_track' %}">Загрузить трек</a>
                <a href="{% url 'my_tracks' %}">Мои треки</a>
                <a href="{% url 'my_albums' %}">Мои альбомы</a>
                <a href="{% url 'my_playlists' %}">Мои плейлисты</a>
                <a href="{% url 'my_likes' %}">Мои лайки</a>
                <a href="{% url 'library' %}">Медиатека</a>
                
                
            {% endif %}
        </div>

        <div class="right">
            {% if user.is_authenticated %}
                <span>Вы вошли как 
                    <a href="{% url 'profile' user.username %}" style="color: #ffd700;">
                        {{ user.username }}
                    </a>
                </span>
                <a href="{% url 'logout' %}">Выйти</a>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
  <style>
        body {
            margin: 0;
            font-family: "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
            background-color: #121212;
            color: #fff;
        }

        a {
            color: #1DB954;
            text-decoration: none;
            transition: 0.2s ease;
        }

        a:hover {
            color: #1ed760;
        }

        nav {
            background: #181818;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav .left a,
        nav .right a {
            margin: 0 12px;
            font-weight: 500;
        }

        nav span {
            margin-right: 10px;
            color: #ccc;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .track-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .track-card {
            background: #181818;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            padding: 15px;
            width: 100%;
            max-width: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .track-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
        }

        .track-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }

        .track-card h3 {
            margin: 5px 0;
            font-size: 18px;
        }

        .track-card audio {
            width: 100%;
            border-radius: 8px;
        }

        button, input[type="submit"] {
            background: #1DB954;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        button:hover, input[type="submit"]:hover {
            background: #1ed760;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #181818;
            color: #999;
            margin-top: 60px;
        }
        .track-link {
    color: #fff;
    text-decoration: none;
    font-size: 1.1em;
    font-weight: bold;
}

.track-link:hover {
    color: #1DB954;
}

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 10px;
            }
            .track-card {
                width: 100%;
            }
        }

.custom-player {
    background: #1e1e2f;
    border-radius: 10px;
    padding: 10px 15px;
    width: 100%;
    box-sizing: border-box;
}

.controls {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
}

.play-pause {
    background: #1db954;
    border: none;
    border-radius: 50%;
    color: white;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s;
}

.play-pause:hover {
    background: #17a44b;
}

.progress-container {
    flex-grow: 1;
    height: 8px;
    background: #333;
    border-radius: 5px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #1db954, #1ed760);
    border-radius: 5px;
    transition: width 0.15s ease;
}

.time {
    color: #bbb;
    font-size: 12px;
    min-width: 40px;
    text-align: right;
}
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 85vh;
    background: #121212;
    padding: 20px;
}

.auth-card {
    background: #181818;
    border-radius: 16px;
    padding: 40px 45px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
    width: 400px;
    max-width: 90%;
    text-align: center;
    animation: fadeIn 0.5s ease-in-out;
}

.auth-card h2 {
    margin-bottom: 25px;
    color: #fff;
    font-size: 26px;
    font-weight: 600;
}

.form-group {
    margin-bottom: 18px;
    text-align: left;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    color: #ccc;
    font-weight: 500;
}

.form-group input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #333;
    border-radius: 8px;
    background: #2a2a2a;
    color: #fff;
    font-size: 15px;
    transition: all 0.3s;
}

.form-group input:focus {
    border-color: #1DB954;
    box-shadow: 0 0 6px rgba(29, 185, 84, 0.4);
    outline: none;
}

/* === Кнопка === */
.btn-primary {
    background: #1DB954;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    width: 100%;
    margin-top: 10px;
    font-weight: 600;
}

.btn-primary:hover {
    background: #1aa34a;
    transform: translateY(-2px);
}

.auth-text {
    margin-top: 20px;
    color: #aaa;
}

.auth-text a {
    color: #1DB954;
    text-decoration: none;
    font-weight: 600;
}

.auth-text a:hover {
    text-decoration: underline;
}

.error-message {
    color: #e74c3c;
    font-size: 14px;
    margin-top: 5px;
}
.search-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}
.search-bar input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #2a2a2a;
    color: #fff;
}
.search-bar button {
    padding: 10px 20px;
    background: #1DB954;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.track-card p, h3 {
    width: 100%;                  
    white-space: nowrap;          
    overflow: hidden;            
    text-overflow: ellipsis;     
    display: block;            
    font-size: 18px;              
    text-align: center;       
    margin: 10px 0;              
    padding: 0 5px;              
}
    </style>
</body>
</html>
